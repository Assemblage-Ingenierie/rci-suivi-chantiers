<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône PATEB : crayons sortant d'un livre ouvert (dessin du logo, agrandi et épaissi pour rester lisible en petit). -->
  <rect width="512" height="512" rx="112" fill="#0B3352"/>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Livre ouvert : une page de chaque côté, puis la couverture -->
    <path d="M 70 316 Q 190 288 256 392" stroke-width="16"/>
    <path d="M 442 316 Q 322 288 256 392" stroke-width="16"/>
    <path d="M 44 352 L 256 414 L 468 352" stroke-width="26"/>
  </g>
  <!-- Crayons devant les pages : corps rempli du fond, puis contour blanc -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M 214 380 L 214 166 L 244 64 L 274 166 L 274 380 Z" fill="#0B3352" stroke="none"/>
    <path d="M 214 380 L 214 166 L 244 64 L 274 166 L 274 380" fill="none" stroke="#FFFFFF" stroke-width="22"/>
    <path d="M 214 166 Q 244 186 274 166" fill="none" stroke="#FFFFFF" stroke-width="16"/>
    <g transform="rotate(24 302 384)">
      <path d="M 282 384 L 282 244 L 302 178 L 322 244 L 322 384 Z" fill="#0B3352" stroke="none"/>
      <path d="M 282 384 L 282 244 L 302 178 L 322 244 L 322 384" fill="none" stroke="#FFFFFF" stroke-width="20"/>
      <path d="M 282 244 Q 302 260 322 244" fill="none" stroke="#FFFFFF" stroke-width="14"/>
    </g>
  </g>
  <!-- Pointes de mine et dos du livre -->
  <g fill="#FFFFFF">
    <path d="M 232 104 L 244 64 L 256 104 Z"/>
    <path d="M 293 208 L 302 178 L 311 208 Z" transform="rotate(24 302 384)"/>
    <ellipse cx="256" cy="426" rx="42" ry="13"/>
  </g>
</svg>
